<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Fake Identity Generator</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header>
    <img src="assets/logo.png" alt="Logo" class="logo">
    <h1>Advanced Fake Identity Generator</h1>

    <!-- Back & Exit Buttons -->
    <div class="header-buttons">
        <button id="backBtn">⬅ Back</button>
        <button id="exitBtn">❌ Exit</button>
    </div>
</header>

<div class="container">

    <div class="controls">
        <select id="gender">
            <option value="any">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <select id="country">
            <option value="any">Select Country</option>
            <option>USA</option>
            <option>UK</option>
            <option>Canada</option>
            <option>Germany</option>
        </select>

        <button id="generate">Generate Identity</button>
    </div>

    <div class="card" id="identityCard">
        <h2 id="name">Name</h2>
        <p id="country">Country</p>
        <p id="address">Address</p>
        <p id="email">Email</p>
        <p id="phone">Phone</p>
        <p id="username">Username</p>
        <p id="password">Password</p>
        <p id="creditCard">Credit Card</p>
        <button onclick="copyIdentity()">Copy Identity</button>
    </div>

</div>

<!-- Data -->
<script src="data/names.js"></script>
<script src="data/surnames.js"></script>
<script src="data/streets.js"></script>
<script src="data/domains.js"></script>

<!-- JS -->
<script src="js/utils.js"></script>
<script src="js/generator.js"></script>
<script src="js/identity.js"></script>
<script src="js/app.js"></script>

<script>
// Back Button
document.getElementById("backBtn").addEventListener("click", () => {
    window.history.back();
});

// Exit Button
document.getElementById("exitBtn").addEventListener("click", () => {
    if(confirm("Are you sure you want to exit?")){
        window.close(); // or redirect: window.location.href = "https://your-homepage.com";
    }
});
</script>

</body>
</html>
