<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Fake Identity Generator</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header>
    <img src="assets/logo.png" alt="Logo" class="logo">
    <h1>Advanced Fake Identity Generator</h1>
</header>

<!-- Sticky Top-Right Buttons -->
<div class="sticky-buttons">
    <button id="backBtn">⬅ Back</button>
    <button id="exitBtn">❌ Exit</button>
</div>

<div class="container">
    <div class="controls">
        <select id="gender">
            <option value="any">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <select id="country">
            <option value="any">Select Country</option>
            <option>USA</option>
            <option>UK</option>
            <option>Canada</option>
            <option>Germany</option>
        </select>

        <button id="generate">Generate Identity</button>
    </div>

    <div class="card" id="identityCard">
        <h2 id="name">Name</h2>
        <p id="countryText">Country</p>
        <p id="address">Address</p>
        <p id="email">Email</p>
        <p id="phone">Phone</p>
        <p id="username">Username</p>
        <p id="password">Password</p>
        <p id="creditCard">Credit Card</p>
        <button id="copyBtn">Copy Identity</button>
    </div>
</div>

<!-- Data -->
<script src="data/names.js"></script>
<script src="data/surnames.js"></script>
<script src="data/streets.js"></script>
<script src="data/domains.js"></script>

<!-- JS -->
<script src="js/app.js"></script>

</body>
</html>
